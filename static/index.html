
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataTrust Audit — Tag, Cookie and Consent Auditing</title>
    <meta name="description" content="DataTrust Audit: B2B SaaS for tag auditing, analytics validation, GA4/GTM diagnostics, LGPD/GDPR compliance, and data quality diagnostics. Detect broken tags, PII leakage, consent issues, and tracking gaps." />
    <meta name="author" content="DataTrust Audit" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="DataTrust Audit — Tag, Cookie and Consent Auditing" />
    <meta property="og:description" content="Detect broken tags, duplicate scripts, GA4 issues, consent violations, and data quality risks. Start your free audit today." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DataTrust Audit" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataTrust Audit — Tag, Cookie and Consent Auditing" />
    <meta name="twitter:description" content="B2B SaaS for analytics teams. Audit GA4, GTM, Meta Pixel, Amplitude, and consent compliance." />

    <!-- Theme color -->
    <meta name="theme-color" content="#070b16" />

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('datatrust-theme') || 'dark';
          var valid = ['dark', 'light', 'executive'];
          if (valid.indexOf(theme) === -1) theme = 'dark';
          document.documentElement.className = theme;
          var colors = { dark: '#070b16', light: '#f8fafc', executive: '#0a1628' };
          document.querySelector('meta[name="theme-color"]').content = colors[theme];
        } catch(e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
